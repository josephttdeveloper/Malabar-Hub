<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Recovery - Malabar Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-3 text-success fw-bold">Password Recovery</h3>
                    <p class="text-muted text-center small mb-4">Enter your registered email address and we'll send you instructions to reset your password.</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" required placeholder="Enter your email">
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2">Send Reset Link</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="{% url 'login' %}" class="text-decoration-none small">Back to Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
