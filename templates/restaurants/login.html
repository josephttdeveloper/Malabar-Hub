<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - Malabar Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }
        .card {
            border-radius: 16px;
            border: none;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg p-4">
                    <h3 class="text-center mb-4 text-success fw-bold">Sign In to Malabar Hub</h3>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        
                        <!-- Active Password Recovery Link -->
                        <div class="mb-3 text-end">
                            <a href="{% url 'password_reset' %}" class="text-decoration-none small text-muted">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Sign In</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'get_started' %}" class="text-decoration-none small">Don't have an account? Get Started</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
