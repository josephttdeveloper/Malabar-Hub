<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Super Admin Login - Malabar Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-lg p-4" style="width: 400px; border-radius: 12px;">
        <div class="text-center mb-4">
            <i class="fas fa-shield-alt text-warning fa-3x mb-2"></i>
            <h3 class="fw-bold">Super Admin Portal</h3>
            <p class="text-muted small">Enter your credentials to access partner verifications.</p>
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 small">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-semibold py-2">Secure Login</button>
        </form>
    </div>
</body>
</html>
