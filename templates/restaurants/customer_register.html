<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Registration - Malabar Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            color: white;
        }
        .auth-card {
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            color: #333;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card auth-card shadow-lg p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-success">Customer Signup</h2>
                        <p class="text-muted small">Create your account to start exploring</p>
                    </div>

                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Full Name</label>
                            <input type="text" name="name" class="form-control form-control-lg fs-6" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Email Address</label>
                            <input type="email" name="email" class="form-control form-control-lg fs-6" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg fs-6" placeholder="Create a password" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-secondary">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control form-control-lg fs-6" placeholder="Re-enter your password" required>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 fw-semibold py-2 shadow-sm">Register as Customer</button>
                    </form>

                    <div class="text-center mt-4 pt-2 border-top">
                        <p class="text-muted small mb-0">Already have an account? <a href="{% url 'login' %}" class="text-success fw-bold text-decoration-none">Sign In</a></p>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a href="{% url 'get_started' %}" class="text-decoration-none text-light fw-semibold opacity-75">
                        <i class="fas fa-arrow-left me-1"></i> Back to Role Selection
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
